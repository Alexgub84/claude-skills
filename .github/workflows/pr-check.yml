name: PR check

# Runs the same validation the release workflow runs, on every pull request to
# main, so a broken SKILL.md or an unparseable manifest cannot merge.

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Validate skills and manifests
        run: node scripts/validate.mjs
