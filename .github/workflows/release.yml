name: Release

# Fires on a pushed tag matching v*. Validates every SKILL.md and manifest,
# packages dist/<name>.zip for each skill, and creates the GitHub Release for
# that exact tag with every ZIP attached. Release assets are immutable: this
# workflow only ever creates a new release for a new tag — it never edits,
# re-uploads to, or re-points an existing one, and there is no "latest" alias.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Validate skills and manifests
        run: node scripts/validate.mjs

      - name: Package skill ZIPs
        run: node scripts/package.mjs

      - name: List built assets
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "${{ github.ref_name }}" \
            --notes "Each attached ZIP is one skill, generated by \`scripts/package.mjs\` from \`skills/<name>/\` at this tag. The ZIP root entry is the skill folder (\`<name>/SKILL.md\`), ready to upload in Claude's Customize > Skills > Upload a skill. These assets are never edited or replaced after publishing; a future change ships as a new tag and a new release."
